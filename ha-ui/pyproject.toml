[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ui"
version = "0.1.0"
description = "Windows local dual-VPS A-first/B-first configuration generator"
requires-python = ">=3.10"
dependencies = [
  "PySide6==6.12.0",
  "paramiko==5.1.0",
  "keyring==25.7.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-qt==4.5.0"]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
ha-ui = "ha_ui.app:main"

[tool.setuptools.packages.find]
include = ["ha_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
  "windows_only: requires a real Windows host",
  "gui: requires Qt (uses the offscreen platform in CI)",
  "integration: runs the real HA-02/03/04 + friendly-export modules",
]
