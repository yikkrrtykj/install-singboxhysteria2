name: HA-UI (Windows local dual-VPS GUI)

# Windows-only GUI slice for issue #110. Path-filtered so it does not duplicate
# the existing bash/HA lanes. No secrets, no VPS access, no Clash/TUN actions.

on:
  push:
    paths:
      - "ha-ui/**"
      - "tools/mihomo-competition-ha-batch.py"
      - "tools/mihomo-competition-ha-profile.py"
      - "tools/mihomo-competition-ha4-fastprobe.py"
      - "tools/mihomo-competition-ha-friendly-export.py"
      - "tools/mihomo-multi-vps-merge.py"
      - "docs/windows-ha-ui*.md"
      - ".github/workflows/ha-ui.yml"
  pull_request:
    paths:
      - "ha-ui/**"
      - "tools/mihomo-competition-ha-batch.py"
      - "tools/mihomo-competition-ha-profile.py"
      - "tools/mihomo-competition-ha4-fastprobe.py"
      - "tools/mihomo-competition-ha-friendly-export.py"
      - "tools/mihomo-multi-vps-merge.py"
      - "docs/windows-ha-ui*.md"
      - ".github/workflows/ha-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax gate
        run: |
          set -euo pipefail
          find ha-ui/ha_ui ha-ui/scripts ha-ui/ci ha-ui/tests -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile
      - name: Exact pin and workflow-template gate (static)
        run: python3 ha-ui/ci/check_pins.py --static-only
      - name: No public listener / no auto-import static gate
        run: |
          set -euo pipefail
          ! grep -RInE "(HTTPServer|socketserver|QTcpServer|subprocess.*clash|startfile.*verge|tun\.enable.*True)" ha-ui/ha_ui || {
            echo "::error::forbidden public listener / auto-import construct"; exit 1; }

  windows-tests:
    name: windows-tests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ha-ui/requirements-dev.txt
      - name: Record interpreter
        shell: pwsh
        run: python -c "import sys; print(sys.version)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r ha-ui/requirements-dev.txt
      - name: Dependency consistency
        run: |
          python -m pip check
          python ha-ui/ci/check_pins.py
      - name: Pytest (offscreen Qt, real NTFS ACL tests included)
        env:
          QT_QPA_PLATFORM: offscreen
        working-directory: ha-ui
        run: python -m pytest tests -q --junitxml=pytest-ha-ui.xml
      - name: GUI cold-start self-test
        env:
          QT_QPA_PLATFORM: offscreen
          HA_UI_HOME: ${{ runner.temp }}\ha-ui-selftest
          HA_UI_TOOLS_DIR: ${{ github.workspace }}\tools
        working-directory: ha-ui
        run: python -m ha_ui.app --self-test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-ui-windows-tests
          path: ha-ui/pytest-ha-ui.xml
          if-no-files-found: error
          retention-days: 7

  windows-exe:
    name: windows-exe
    needs: windows-tests
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ha-ui/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r ha-ui/requirements-dev.txt
      - name: Dependency consistency
        run: |
          python -m pip check
          python ha-ui/ci/check_pins.py
      - name: Build unsigned EXE + cold-start smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ha-ui/scripts/build_windows.py
      - name: Verify receipt, pinned versions and EXE SHA-256
        shell: pwsh
        run: |
          $receipt = Get-Content dist\receipt.json -Raw | ConvertFrom-Json
          if (-not $receipt.selftest.ok) { throw "selftest not ok" }
          if ($receipt.signed -ne $false) { throw "unexpected signing claim" }
          if ($receipt.configuration_embedded -ne $false) { throw "config embedded" }
          if ($receipt.python -notlike "3.13.*") { throw "unexpected Python: $($receipt.python)" }
          if ($receipt.pyinstaller -ne "6.22.3") { throw "unexpected PyInstaller: $($receipt.pyinstaller)" }
          foreach ($name in @("PySide6","paramiko","keyring")) {
            $want = (Get-Content ha-ui\requirements.txt | Select-String "^$name==").ToString().Split("==")[1]
            if ($receipt.dependencies.$name -ne $want) { throw "receipt dependency mismatch: $name" }
          }
          $sha = (Get-FileHash dist\ha-ui.exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $receipt.exe_sha256) { throw "exe hash mismatch" }
          $size = (Get-Item dist\ha-ui.exe).Length
          if ($size -ne $receipt.exe_bytes) { throw "exe size mismatch" }
          @(
            "### HA-UI Windows EXE",
            "- EXE: ha-ui.exe ($size bytes)",
            "- SHA-256: ``$sha``",
            "- receipt: signed=false, configuration_embedded=false, selftest ok",
            "- source tree: ``$($receipt.source_tree_sha256)``"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Output "receipt OK: $sha"
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-ui-windows-exe
          path: |
            dist/ha-ui.exe
            dist/receipt.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
