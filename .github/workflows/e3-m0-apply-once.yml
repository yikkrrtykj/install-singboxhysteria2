name: e3-m0-apply-once

on:
  push:
    branches:
      - feature/e3-m0-transaction-hardening
    paths:
      - tools/e3-m0-apply.py
      - tools/e3-m0-fix-phasec.py
      - .github/workflows/e3-m0-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/e3-m0-transaction-hardening
          fetch-depth: 0

      - name: Apply M0 patch
        run: |
          python3 tools/e3-m0-apply.py
          python3 tools/e3-m0-fix-phasec.py

      - name: Syntax gate
        run: bash -n install.sh

      - name: M0 static contract
        run: bash tests/e3/test-m0-static-contract.sh

      - name: Legacy transaction regression
        run: bash tests/test-legacy-config-transactions.sh

      - name: Phase C regression
        run: bash tests/test-phase-c.sh

      - name: Phase D regression
        run: bash tests/test-phase-d.sh

      - name: Existing API auth regression
        run: bash tests/test-existing-api-auth-migration.sh

      - name: Commit implementation and remove one-shot machinery
        env:
          BRANCH: feature/e3-m0-transaction-hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/e3-m0-apply.py tools/e3-m0-fix-phasec.py .github/workflows/e3-m0-apply-once.yml
          git add install.sh tests/test-legacy-config-transactions.sh tests/e3/test-m0-static-contract.sh
          git diff --cached --check
          git commit -m "e3: harden rollback and preserve control-plane lock anchor"
          git push origin HEAD:"$BRANCH"
