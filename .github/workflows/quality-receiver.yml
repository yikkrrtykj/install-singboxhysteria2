name: quality-receiver
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python contracts
        shell: python
        run: |
          import os, subprocess, sys
          if sys.platform == 'win32':
              os.environ['P48_TEST_OPENSSL'] = r'C:\Program Files\Git\usr\bin\openssl.exe'
          subprocess.run([sys.executable, '-B', 'tests/test_quality_persistent.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_failover.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_receiver_update.py'], check=True)
      - name: Python syntax
        run: python -m py_compile tools/quality-receiver-service.py tools/quality_failover/persistent.py tests/quality-receiver-systemd-lab.py
  systemd-credentials:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Isolated service and renewal with real systemd credentials
        run: sudo python3 -B tests/quality-receiver-systemd-lab.py
      - name: Installer syntax
        run: bash -n tools/quality-receiver/install.sh
