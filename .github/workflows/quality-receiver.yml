name: quality-receiver
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python contracts
        shell: python
        run: |
          import os, subprocess, sys
          if sys.platform == 'win32':
              os.environ['P48_TEST_OPENSSL'] = r'C:\Program Files\Git\usr\bin\openssl.exe'
          subprocess.run([sys.executable, '-B', 'tests/test_quality_persistent.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_failover.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_receiver_update.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_desktop.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_windows_lab.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_daily.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_rollout.py'], check=True)
          subprocess.run([sys.executable, '-B', 'tests/test_quality_publication_startup.py'], check=True)
      - name: Python syntax
        run: python -m py_compile tools/quality-receiver-service.py tools/quality_failover/persistent.py tests/quality-receiver-systemd-lab.py
  systemd-credentials:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Isolated service and renewal with real systemd credentials
        run: sudo python3 -B tests/quality-receiver-systemd-lab.py
      - name: Quality download publication and authenticated HTTP
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq openssl
          getent group sboxweb || sudo groupadd --system sboxweb
          sudo python3 -B tests/remote-production/test_quality_distribution_linux.py
      - name: Installer syntax
        run: bash -n tools/quality-receiver/install.sh

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned standalone EXE
        run: |
          python -m pip install -r tools/quality-windows-build-requirements.txt
          python -B tools/build-quality-windows.py --output quality-build
      - name: Native frozen EXE with no Python environment
        shell: pwsh
        run: |
          $env:P48_TEST_OPENSSL = 'C:\Program Files\Git\usr\bin\openssl.exe'
          python -B tests/quality-windows-exe-lab.py --exe 'quality-build/software/质量切换.exe' --build-receipt quality-build/build.json --report quality-build/acceptance.json
      - name: Keep unsigned build and acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-windows-test-receipts
          path: |
            quality-build/build.json
            quality-build/acceptance.json
          if-no-files-found: warn
      - name: Recipient and user-start contracts
        run: |
          python -B tests/test_quality_desktop.py
          python -B tests/test_quality_windows_lab.py
