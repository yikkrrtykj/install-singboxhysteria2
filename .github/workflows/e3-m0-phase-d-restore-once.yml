name: e3-m0-phase-d-restore-once

on:
  push:
    branches:
      - feature/e3-m0-transaction-hardening
    paths:
      - tools/e3-m0-phase-d-restore.py
      - .github/workflows/e3-m0-phase-d-restore-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/e3-m0-transaction-hardening
          fetch-depth: 0

      - name: Apply Phase D restore hardening
        run: python3 tools/e3-m0-phase-d-restore.py

      - name: Syntax and M0 shared contracts
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n lib/client-management.sh
          bash tests/e3/test-m0-static-contract.sh
          bash tests/e3/test-m0-shared-lib.sh

      - name: Legacy transaction regression
        run: bash tests/test-legacy-config-transactions.sh

      - name: Phase C regression
        run: bash tests/test-phase-c.sh

      - name: Phase D regression
        run: bash tests/test-phase-d.sh

      - name: Existing API auth regression
        run: bash tests/test-existing-api-auth-migration.sh

      - name: Commit hardening and remove one-shot machinery
        env:
          BRANCH: feature/e3-m0-transaction-hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/e3-m0-phase-d-restore.py .github/workflows/e3-m0-phase-d-restore-once.yml
          git add install.sh lib/client-management.sh tests/
          git diff --cached --check
          git commit -m "e3: unify Phase D rollback on atomic restore primitive"
          git push origin HEAD:"$BRANCH"
