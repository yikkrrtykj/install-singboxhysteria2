name: Unified Monitor Go
on:
  push:
    paths: ['um/**', '.github/workflows/um-go.yml']
  pull_request:
    paths: ['um/**', '.github/workflows/um-go.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
    defaults:
      run:
        working-directory: um
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: go version
      - run: go test -count=1 ./...
      - run: go build -trimpath ./...
