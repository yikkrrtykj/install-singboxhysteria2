name: e3-m0-fix-s0-static-once

on:
  push:
    branches:
      - feature/e3-m0-transaction-hardening
    paths:
      - tools/e3-m0-fix-s0-static.py
      - .github/workflows/e3-m0-fix-s0-static-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/e3-m0-transaction-hardening
          fetch-depth: 0

      - name: Apply S0 assertion fix
        run: python3 tools/e3-m0-fix-s0-static.py

      - name: S0 security-baseline regression
        run: bash tests/test-security-baseline.sh

      - name: M0 contracts and key regressions
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n lib/client-management.sh
          bash tests/e3/test-m0-static-contract.sh
          bash tests/e3/test-m0-shared-lib.sh
          bash tests/test-legacy-config-transactions.sh
          bash tests/test-phase-c.sh
          bash tests/test-phase-d.sh
          bash tests/test-existing-api-auth-migration.sh

      - name: Commit fix and remove one-shot machinery
        env:
          BRANCH: feature/e3-m0-transaction-hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/e3-m0-fix-s0-static.py .github/workflows/e3-m0-fix-s0-static-once.yml
          git add tests/test-security-baseline.sh
          git diff --cached --check
          git commit -m "test(e3): follow canonical lib in S0 static assertions"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
