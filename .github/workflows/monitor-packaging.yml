name: monitor-packaging

on:
  push:
    branches: [feature/monitor-packaging]
  pull_request:

jobs:
  packaging-tests:
    # The atomic release-switch tests (T02-T05, T11) need real symlink
    # rename(2) semantics, so the full suite runs on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Monitor v2 packaging test suite
        run: bash tests/test-monitor-packaging.sh
