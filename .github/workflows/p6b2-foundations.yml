name: p6b2-foundations
on:
  pull_request:
  push:
    branches: [main]
jobs:
  foundations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual TLS, profile, bounded runtime and native Windows security
        run: python tests/remote-production/test_foundations.py
      - name: Daily Clash opt-in private preparation and worker lifecycle
        if: runner.os == 'Windows'
        run: python -B tests/test_quality_daily.py
      - name: Actual native SCM service start pause continue stop
        if: runner.os == 'Windows'
        run: python tests/remote-production/test_service_scm.py
      - name: Native internal publisher identity trust reuse and exact removal
        if: runner.os == 'Windows'
        run: python tests/remote-production/test_internal_publisher.py --require-admin
  provisioning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux authority and Client worker dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq openssl nginx nftables
          getent group sboxweb || sudo groupadd --system sboxweb
      - name: Actual live Monitor enrollment revocation crash concurrency and Client deletion
        run: sudo -n python3 tests/remote-production/test_provisioning.py
      - name: Actual identity nginx TLS systemd nft namespace and hostile burst load
        run: sudo -n python3 tests/remote-production/test_ingress.py
