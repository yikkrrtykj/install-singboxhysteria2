name: shell-tests

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR commits stop consuming runners; a main push is NEVER
# auto-cancelled (the merge-SHA run is the authoritative record).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------
  # Lane A -- fast feedback. Every OS-independent syntax/static gate lives
  # here so ordinary coding failures surface in ~1 minute, before the heavy
  # regression lanes are even scheduled.
  # ---------------------------------------------------------------------
  fast-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq shellcheck acl
          flock --version || sudo apt-get install -y util-linux

      - name: Environment diagnostics (no secrets)
        run: |
          . /etc/os-release && printf 'os=%s %s\n' "$ID" "$VERSION_ID"
          python3 --version
          systemd --version | head -n1
          uname -r

      - name: bash -n (all shell sources)
        run: |
          bash -n install.sh
          bash -n install-linux-gateway.sh
          bash -n tests/test-phase-c.sh
          bash -n tests/test-phase-d.sh
          bash -n tests/test-security-baseline.sh
          bash -n tests/test-install-host-deps.sh
          bash -n tests/canary-api-auth.sh
          bash -n tests/test-monitor-v2-e1.sh
          bash -n tests/test-monitor-v2-e2.sh
          bash -n tests/test-monitor-v2-m05.sh
          bash -n tests/test-monitor-v2-e4.sh
          bash -n tests/test-monitor-v2-e4diag.sh
          bash -n tests/test-legacy-config-transactions.sh
          bash -n tests/test-existing-api-auth-migration.sh
          bash -n tests/test-journal-time-compat.sh
          bash -n tests/lib/journal-time.sh
          bash -n tests/lib/mock-flock.sh
          bash -n tests/test-monitor-packaging.sh
          bash -n lib/sbox-cm-state.sh
          bash -n sbox-cm/sbox-cm-ops
          bash -n sbox-cm/deploy/install-sbox-cm.sh
          bash -n tests/e3/test-m0-shared-lib.sh
          bash -n tests/e3/test-m0-static-contract.sh
          bash -n tests/e3/test-m1-shared-lib.sh
          bash -n tests/e3/test-m4-renderer.sh
          bash -n tests/e3/test-m1-worker.sh
          bash -n tests/e3/test-m1-rpc.sh
          bash -n tests/e3/test-m1-static.sh
          bash -n tests/e3/test-m1-deploy.sh
          bash -n tests/e3/test-m1-crash.sh
          bash -n tests/e3/test-m1-systemd.sh
          bash -n tests/e3/test-m2-live.sh
          bash -n tests/test-monitor-v2-m2.sh
          bash -n tests/test-monitor-v2-hist.sh
          bash -n tests/test-monitor-v2-jr.sh
          bash -n tests/test-monitor-v2-jr-deploy.sh
          bash -n tests/test-monitor-v2-p2b-integration.sh
          bash -n monitor-v2/deploy/app-bin/monitor-contract-probe
          bash -n tests/journal-reader/test-jr-live.sh
          bash -n tests/journal-reader/test-jr-exchange-access.sh
          bash -n tests/e3/test-m3-deploy.sh
          bash -n tests/e3/test-m3c-phase1.sh
          bash -n tests/e3/test-m3c-phase2.sh
          bash -n tests/e3/test-m3c-phase3.sh
          bash -n monitor-v2/deploy/e3-preflight.sh
          bash -n monitor-v2/deploy/e3-deploy-verify.sh
          bash -n monitor-v2/deploy/e3-rollback.sh
          bash -n monitor-v2/deploy/e3-m3c-phase1.sh
          bash -n monitor-v2/deploy/e3-m3c-phase2.sh
          bash -n monitor-v2/deploy/e3-m3c-phase3.sh

  # ---------------------------------------------------------------------
  # Lane B -- core regression. OS-independent product contracts that do not
  # depend on a specific distro's systemd/PID1: the packaging suite is NOT
  # here (it is owned by the monitor-packaging workflow); LIVE systemd gates
  # are NOT here (they live in the compatibility matrix). Each command runs
  # exactly once, on 24.04.
  # ---------------------------------------------------------------------
  core-regression:
    runs-on: ubuntu-24.04
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq shellcheck acl
          flock --version || sudo apt-get install -y util-linux

      - name: Phase C regression suite
        run: bash tests/test-phase-c.sh

      - name: Phase D regression suite
        run: bash tests/test-phase-d.sh

      - name: S0 security-baseline regression suite (incl. Linux-only mode assertions)
        run: bash tests/test-security-baseline.sh

      # The top-level host dependency bootstrap (package -> command map: acl
      # provides setfacl/getfacl, util-linux provides runuser) is what makes a
      # fresh Ubuntu host able to reach Monitor 0.3.1's journal-reader
      # activation at all, so it is a core product contract.
      - name: "Host dependency bootstrap regression suite (install.sh package->command map, fail-closed verification)"
        run: bash tests/test-install-host-deps.sh

      - name: Legacy config transaction hardening regression suite (real flock on Linux)
        run: bash tests/test-legacy-config-transactions.sh

      - name: Existing service.api auth migration regression suite (narrow S0 migration)
        run: bash tests/test-existing-api-auth-migration.sh

      - name: E3 M0 shared transaction library + static contract
        run: |
          bash tests/e3/test-m0-shared-lib.sh
          bash tests/e3/test-m0-static-contract.sh

      - name: "E3 M1-A canonical shared library closure + planned credential hygiene"
        run: bash tests/e3/test-m1-shared-lib.sh

      - name: "E3 M4 canonical Mihomo renderer contract (single source / purity / fail-closed)"
        run: bash tests/e3/test-m4-renderer.sh

      - name: "E3 M1 static contract (single engine / seven ops / systemd candidate)"
        run: bash tests/e3/test-m1-static.sh

      - name: "E3 M1 privileged worker (ledger / journal / idempotency / degraded)"
        run: bash tests/e3/test-m1-worker.sh

      - name: "E3 M1 RPC core (schema / framing / peer auth / replay)"
        run: bash tests/e3/test-m1-rpc.sh

      - name: "E3 M1 deployment contract (never auto-activates; disable closes socket AND service)"
        run: bash tests/e3/test-m1-deploy.sh

      - name: "E3 M1 crash points inside the commit engine (kill -9 at each journal phase)"
        run: |
          bash -n tests/e3/test-m1-crash.sh
          bash tests/e3/test-m1-crash.sh

      - name: "E3 M3-C Phase 1 orchestrator (journal / gates / classified recovery)"
        run: bash tests/e3/test-m3c-phase1.sh

      - name: "E3 M3-C Phase 2 canary (approval boundary / fail-closed cleanup / recovery)"
        run: bash tests/e3/test-m3c-phase2.sh

      - name: "E3 M3-C Phase 3 go-live (approval boundary / persistent active / fail-closed recovery)"
        run: bash tests/e3/test-m3c-phase3.sh

  # ---------------------------------------------------------------------
  # Lane C -- Monitor-v2 regression. The OS-independent Monitor web/collector
  # contracts (E1/E2/E4 + M0.5 privilege boundary + the E3 M2 web-adapter
  # broker/breaker/auth/HTTP suite). LIVE M2 systemd integration is owned by
  # the compatibility matrix. No packaging here.
  # ---------------------------------------------------------------------
  monitor-regression:
    runs-on: ubuntu-24.04
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq shellcheck acl
          flock --version || sudo apt-get install -y util-linux

      - name: E1 collector regression suite
        run: bash tests/test-monitor-v2-e1.sh

      - name: E2 web dashboard regression suite
        run: bash tests/test-monitor-v2-e2.sh

      - name: M0.5 step-up auth + monitor privilege boundary regression suite
        run: bash tests/test-monitor-v2-m05.sh

      - name: E4 Mihomo enrichment regression suite
        run: bash tests/test-monitor-v2-e4.sh

      - name: E4-Diag Mihomo failover forensics regression suite
        run: bash tests/test-monitor-v2-e4diag.sh

      - name: "E3 M2 web adapter contract suite (broker / breaker / auth / HTTP adapter)"
        run: bash tests/test-monitor-v2-m2.sh

      - name: "0.2.0 incident history suite (storage / privacy / cadence / retention / failure / read endpoint, issue #33 P1)"
        run: bash tests/test-monitor-v2-hist.sh

      - name: "sbox-journal-reader suite (cursor / classifier / eligibility / recovery / crash matrix / ingest contract / wiring confinement, issue #33 P2 PR-2A)"
        run: bash tests/test-monitor-v2-jr.sh

      - name: "sbox-journal-reader PR-2B deploy/activation suite (identity / directories / verify-before-install / enable-start / rollback matrix / uninstall / sing-box invariants, issue #33 P2 PR-2B)"
        run: bash tests/test-monitor-v2-jr-deploy.sh

      - name: "PR-2B INTEGRATION suite (Coding D + Coding E as ONE immutable release unit: packaged contract import / release coupling / dual-ref retention / v1->v2 migration through the installed release, issue #33 P2)"
        run: bash tests/test-monitor-v2-p2b-integration.sh

  # ---------------------------------------------------------------------
  # Lane D -- compatibility matrix. Runs on the three supported Ubuntu LTS
  # baselines and carries ONLY the distro / systemd / PID1-sensitive gates:
  # journal-time behaviour and every LIVE systemd integration + the
  # systemd-analyze unit/hardening validation. The REQUIRE_LIVE fail-closed
  # contracts are preserved verbatim -- a SKIP on a live gate is a hard
  # failure, never a green substitute. fail-fast:false so one baseline's
  # failure does not hide the others.
  # ---------------------------------------------------------------------
  bash-suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq shellcheck acl
          flock --version || sudo apt-get install -y util-linux

      - name: Environment diagnostics (no secrets)
        run: |
          . /etc/os-release && printf 'os=%s %s\n' "$ID" "$VERSION_ID"
          python3 --version
          systemd --version | head -n1
          uname -r

      # Runner-boot readiness gate (issue #35 review): the lane split reaches
      # the LIVE/preflight work ~5 min earlier than the old serial matrix,
      # which exposed a deterministic environmental race -- a freshly booted
      # Ubuntu runner can transiently report is-system-running=starting, and
      # e3-preflight.sh P13 correctly fails closed on it (attempt 1 of run
      # 35696438934 on ubuntu-22.04). This is a bounded wait, NOT a retry: the
      # accepted states are exactly P13's (running|degraded), an already-ready
      # runner falls straight through, and a runner still unsettled after 120s
      # is a HARD failure -- never a SKIP or soft green. Placed ahead of every
      # suite in this matrix because journalctl-based checks are sensitive to
      # the same transient. No test, preflight or runtime file is touched.
      - name: Wait for systemd runner readiness
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state="$(systemctl is-system-running 2>/dev/null || true)"
            case "$state" in
              running|degraded)
                echo "systemd ready: $state"
                exit 0
                ;;
            esac
            echo "systemd not ready yet: ${state:-unknown} ($i/60)"
            sleep 2
          done

          echo "::error::systemd did not reach running/degraded within 120s"
          systemctl is-system-running || true
          systemctl --failed --no-pager || true
          exit 1

      - name: "Journal time compatibility regression suite (B6 finding: raw RFC3339 rejected by Ubuntu 22.04 journalctl)"
        run: bash tests/test-journal-time-compat.sh

      # SBHOST_REQUIRE_LIVE=1: the host dependency gates are about REAL acl /
      # util-linux binaries and the REAL Monitor consumer predicate, so they
      # must execute on every baseline -- a SKIP here would be a false green.
      - name: "Host dependency bootstrap LIVE (real setfacl/getfacl/runuser, real-host idempotence, Monitor predicate agreement)"
        run: |
          bash -n tests/test-install-host-deps.sh
          env SBHOST_REQUIRE_LIVE=1 bash tests/test-install-host-deps.sh

      - name: "E3 M1 B-5 LIVE systemd integration (real socket+service under PID 1: PEERCRED / add / reload / rollback / reconcile)"
        run: |
          bash -n tests/e3/test-m1-systemd.sh
          # SBOX_CM_REQUIRE_LIVE=1: on CI the live gate MUST really execute; a
          # SKIP here would be a false green. The suite also checks its own
          # exit-status contract, so a failing run can no longer exit 0 through
          # its teardown trap (that is how this step once stayed green at
          # FAIL=10).
          sudo -n env SBOX_CM_REQUIRE_LIVE=1 bash tests/e3/test-m1-systemd.sh

      - name: "E3 M2 LIVE systemd integration (real monitor unit x real sbox-cm: carve-out experiment / full transaction / result_unknown / stale-active fail closed)"
        run: |
          bash -n tests/e3/test-m2-live.sh
          # SINGBOX_MONITOR_REQUIRE_LIVE=1: on CI the live gate MUST really
          # execute; a SKIP here is a hard failure (the B-5 lesson).
          sudo -n env SINGBOX_MONITOR_REQUIRE_LIVE=1 bash tests/e3/test-m2-live.sh

      - name: "E3 M3 deploy tooling (preflight / deploy-verify / rollback against a live fixture)"
        run: |
          bash -n tests/e3/test-m3-deploy.sh
          sudo -n env SBOX_E3_REQUIRE_LIVE=1 bash tests/e3/test-m3-deploy.sh

      - name: "E3 M3-C Phase 2 LIVE (real socket/service + E3RpcClient + canonical worker/library)"
        run: |
          bash -n tests/e3/test-m3c-phase2-live.sh
          sudo -n env E3_PHASE2_REQUIRE_LIVE=1 bash tests/e3/test-m3c-phase2-live.sh

      - name: "E3 M3-C Phase 3 LIVE (real inactive-to-active without client mutation)"
        run: |
          bash -n tests/e3/test-m3c-phase3-live.sh
          sudo -n env E3_PHASE3_REQUIRE_LIVE=1 bash tests/e3/test-m3c-phase3-live.sh

      - name: "sbox-journal-reader LIVE (real journalctl cursor telemetry + real Reader cycle + systemd-analyze on the rendered unit)"
        run: |
          bash -n tests/journal-reader/test-jr-live.sh
          # SBOX_JR_REQUIRE_LIVE=1: on CI the live gate MUST really execute;
          # a SKIP here is a hard failure (the B-5 lesson).
          sudo -n env SBOX_JR_REQUIRE_LIVE=1 bash tests/journal-reader/test-jr-live.sh

      # B7: the exchange-access gates are REAL-permission gates (disposable
      # identities, real setfacl/getfacl, real runuser), so they must execute
      # on every baseline. A SKIP here is a hard failure: a mock cannot prove
      # that the Monitor identity can traverse the reader data root.
      - name: "sbox-journal-reader EXCHANGE ACCESS LIVE (production-shaped tree: consumer traversal, sanitized unreadable-storage degradation, recovery, idempotent ACL convergence)"
        run: |
          bash -n tests/journal-reader/test-jr-exchange-access.sh
          sudo -n env SBOX_JR_XACCESS_REQUIRE_LIVE=1 bash tests/journal-reader/test-jr-exchange-access.sh

      # The PR-2B integration gates are symlink/rename(2)-semantic gates, so
      # they must execute on EVERY baseline: the suite itself turns any SKIP on
      # Linux into a hard failure (spec §14: a skipped gate is never a green).
      - name: "PR-2B INTEGRATION suite on the compatibility matrix (one immutable release unit: packaged contract import / release coupling / dual-ref retention / v1->v2 migration; SKIP on Linux is a hard failure)"
        run: bash tests/test-monitor-v2-p2b-integration.sh

      - name: "systemd unit validation (sbox-cm socket + service candidate)"
        run: |
          set -o pipefail
          U="$RUNNER_TEMP/sbox-cm-units"
          mkdir -p "$U"
          sed -e 's|@SBXCM_GROUP@|sboxweb|g' -e 's|@SBXCM_LIBEXEC@|/usr/local/lib/sbox-cm|g' \
              sbox-cm/deploy/sbox-cm.socket.in > "$U/sbox-cm.socket"
          sed -e 's|@SBXCM_GROUP@|sboxweb|g' -e 's|@SBXCM_LIBEXEC@|/usr/local/lib/sbox-cm|g' \
              sbox-cm/deploy/sbox-cm.service.in > "$U/sbox-cm.service"
          # Placeholder runtime file so ExecStart resolves during verify.
          sudo mkdir -p /usr/local/lib/sbox-cm
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/lib/sbox-cm/sbox-cm >/dev/null
          sudo chmod 0755 /usr/local/lib/sbox-cm/sbox-cm
          vrc=0
          systemd-analyze verify "$U/sbox-cm.socket" "$U/sbox-cm.service" 2>&1 | tee "$U/verify.log" || vrc=$?
          # HARD GATE: any diagnostic attributed to OUR units is a failure. A
          # nonzero rc caused purely by unrelated runner units is tolerated (and
          # reported) because verify walks the whole dependency graph.
          if grep -E 'sbox-cm\.(service|socket)' "$U/verify.log" \
             | grep -Eqi 'unknown key|unsupported|not supported|failed|error|not executable|no such file'; then
            echo "::error::systemd on ${{ matrix.os }} rejected or ignored a directive in the sbox-cm units"
            exit 1
          fi
          if [ "$vrc" -ne 0 ]; then
            echo "note: systemd-analyze verify exited rc=$vrc on ${{ matrix.os }}; no diagnostic was attributed to the sbox-cm units (see above)."
          fi
          # Informational-only BY DETECTION, never by swallowing errors: when
          # this systemd supports --offline analysis its rc is propagated by
          # pipefail (a nonzero rc fails the step). When it does not, the live
          # B-5 integration step above is the enforced gate for the sbox-cm
          # units and this line documents the capability gap explicitly.
          if systemd-analyze security --help >"$U/security-help.log" 2>&1 \
             && grep -q -- '--offline' "$U/security-help.log"; then
            systemd-analyze security --offline=yes "$U/sbox-cm.service" | tee "$U/security.log"
          else
            echo "systemd-analyze security --offline is NOT supported on this baseline (systemd $(systemd --version | head -n1 | awk '{print $2, $3}')); the LIVE B-5 step is the enforced gate here and this analysis is documented informational-only."
          fi

      - name: systemd unit + hardening directive validation (portable supported subset)
        run: |
          set -o pipefail
          UNIT="$RUNNER_TEMP/singbox-monitor.service"
          sed -e 's|@SBMON_USER@|sboxweb|g' \
              -e 's|@SBMON_GROUP@|sboxweb|g' \
              -e 's|@SBMON_APP_DIR@|/opt/singbox-monitor|g' \
              -e 's|@SBMON_CONF@|/etc/singbox-monitor/monitor.conf|g' \
              -e 's|@SBMON_STATE_ROOT@|/var/lib/singbox-monitor|g' \
              monitor-v2/deploy/singbox-monitor.service.in > "$UNIT"
          # Placeholder runtime files: on a real host install-monitor.sh
          # installs them; verify must still be able to resolve the unit's
          # filesystem references (ExecStart binary, WorkingDirectory).
          sudo mkdir -p /opt/singbox-monitor/bin /etc/singbox-monitor /var/lib/singbox-monitor
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/singbox-monitor/bin/monitor-service >/dev/null
          sudo chmod 0755 /opt/singbox-monitor/bin/monitor-service
          vrc=0
          systemd-analyze verify "$UNIT" 2>&1 | tee "$RUNNER_TEMP/unit-verify.log" || vrc=$?
          # HARD GATE (all baselines) -- FAIL-CLOSED rc contract:
          #   1. any error/ignored-directive diagnostic attributed to
          #      singbox-monitor.service is a hard failure;
          #   2. a nonzero verify rc with EMPTY or UNCLASSIFIED diagnostics
          #      is a hard failure ("no target-unit grep match" alone is
          #      NEVER proof that an arbitrary nonzero rc is safe);
          #   3. a nonzero verify rc is tolerated ONLY when EVERY diagnostic
          #      line is mechanically classified by the UNRELATED_NOISE
          #      allowlist below (exact, unit-attributed runner noise).
          # verify scans the unit's dependency graph, so UNRELATED runner
          # system units can emit noise (e.g. snapd 'Unknown key name
          # RestartMode' on 22.04, netplan permission errors, CPUAccounting
          # removal notices on 26.04). An isolation root (--root=) would
          # break cross-baseline dependency resolution, so the rc contract
          # above keeps the gate fail-closed without weakening it: any NEW
          # or unrecognized diagnostic on ANY unit fails the step.
          # Any unknown/unsupported/failed directive or unresolvable
          # reference on OUR unit is a hard failure (security-critical
          # directives are never silently ignored).
          if grep -E 'singbox-monitor\.service' "$RUNNER_TEMP/unit-verify.log" \
             | grep -Eqi 'unknown key|unsupported|not supported|failed|error|not executable|no such file'; then
            echo "::error::systemd on ${{ matrix.os }} rejected or ignored a directive in the production unit"
            exit 1
          fi
          # Mechanically classified UNRELATED runner-unit diagnostics. Every
          # pattern below is anchored to a NON-production runner unit; a
          # singbox-monitor.service line can NEVER match (the target-unit
          # grep -v guard below strips those first, and HARD GATE 1 already
          # failed on any target-unit error).
          UNRELATED_NOISE_RE='netplan-ovs-cleanup\.service: Failed to open |Unknown key name .RestartMode.|Support for option CPUAccounting= has been removed'
          if [ "$vrc" -ne 0 ]; then
            unrelated="$(grep -v 'singbox-monitor\.service' "$RUNNER_TEMP/unit-verify.log" \
                          | grep -Ec "$UNRELATED_NOISE_RE" || true)"
            unclassified="$(grep -v 'singbox-monitor\.service' "$RUNNER_TEMP/unit-verify.log" \
                             | grep -Ev "$UNRELATED_NOISE_RE" \
                             | grep -Ev '^[[:space:]]*$' || true)"
            if [ -n "$unclassified" ]; then
              echo "::error::systemd-analyze verify on ${{ matrix.os }} exited rc=$vrc with UNCLASSIFIED diagnostics (fail-closed; not in the unrelated-runner-noise allowlist):"
              printf '%s\n' "$unclassified" | head -n 20
              exit 1
            fi
            if [ "$unrelated" -eq 0 ]; then
              echo "::error::systemd-analyze verify on ${{ matrix.os }} exited rc=$vrc with EMPTY diagnostics (fail-closed hard gate)"
              exit 1
            fi
            echo "note: systemd-analyze verify exited rc=$vrc on ${{ matrix.os }}; all $unrelated diagnostic line(s) are mechanically classified UNRELATED runner-unit noise (allowlisted) and singbox-monitor.service itself is error-free -- production-unit gate holds."
          fi
          # HARD GATE #2 (capability-detected): systemd-analyze security
          # --offline=yes is enforced wherever this systemd supports it: its
          # rc is propagated by pipefail, so a nonzero rc fails the step. On a
          # baseline whose systemd lacks offline analysis, `verify` above
          # remains the hard gate and `security` is explicitly documented as
          # INFORMATIONAL-only there (documented in monitor-v2/deploy/README.md
          # §"兼容性预检与环境诊断") -- it is never silently soft-passed.
          # The capability probe goes through a FILE (not `cmd | grep -q`):
          # under pipefail, grep -q can exit early and SIGPIPE the producer,
          # which would turn the probe itself into a spurious hard failure.
          if systemd-analyze security --help >"$RUNNER_TEMP/security-help.log" 2>&1 \
             && grep -q -- '--offline' "$RUNNER_TEMP/security-help.log"; then
            systemd-analyze security --offline=yes "$UNIT" | tee "$RUNNER_TEMP/unit-security.log"
          else
            echo "systemd-analyze security --offline is NOT supported on this baseline (systemd $(systemd --version | head -n1 | awk '{print $2, $3}')); 'verify' is the enforced hard gate here and the security analysis is informational-only on this runner (documented contract)."
          fi

      - name: Compatibility matrix complete (all LIVE + systemd gates green)
        run: "echo 'journal-time + E3 M1/M2/M3/M3-C LIVE systemd + sbox-jr LIVE + sbox-cm/monitor unit validation: all green on ${{ matrix.os }}'"

  # ---------------------------------------------------------------------
  # Aggregator -- the single merge-gate verdict. It FAILS unless fast-checks,
  # core-regression, monitor-regression and every bash-suites matrix cell
  # all succeeded. (The monitor-packaging workflow owns the packaging
  # contracts and is a separate required check.)
  # ---------------------------------------------------------------------
  ci-gate:
    runs-on: ubuntu-24.04
    needs: [fast-checks, core-regression, monitor-regression, bash-suites]
    # `if: always()` so a matrix-cell failure still reaches the gate and is
    # reported as an explicit red verdict rather than a silent skip.
    if: always()
    steps:
      - name: Aggregate shell-tests lanes
        env:
          FAST: ${{ needs.fast-checks.result }}
          CORE: ${{ needs.core-regression.result }}
          MONITOR: ${{ needs.monitor-regression.result }}
          SUITES: ${{ needs.bash-suites.result }}
        run: |
          echo "fast-checks=$FAST core-regression=$CORE monitor-regression=$MONITOR bash-suites=$SUITES"
          for lane in "$FAST" "$CORE" "$MONITOR" "$SUITES"; do
            if [ "$lane" != "success" ]; then
              echo "::error::ci-gate FAILED: a lane resolved to '$lane' (only 'success' passes)"
              exit 1
            fi
          done
          echo "ci-gate: all shell-tests lanes green"
