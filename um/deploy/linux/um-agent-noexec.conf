# UM-B3 Draft noexec drop-in — installed by install-agent.sh on systemd >= 248
# only (Debian 12 / systemd 252 and Ubuntu 22.04 / systemd 249 support these directives; do not load
# this file there — an unknown directive would make the unit fail to load).
#
# Effect: the unit's mount namespace has no executable paths except the
# immutable, root-owned agent binary, so the process cannot fork/exec anything
# else (no shell, no systemctl, no helper). This is the *supported* no-exec
# mechanism for a systemd service; blocking execve/execveat via
# SystemCallFilter= is not valid because systemd applies the filter before the
# unit's own exec and the service would necessarily fail to start.
#
# Verification in the lab (UM-E/UM-B3 lab, not executed by this repository):
#   systemd-analyze verify /etc/systemd/system/um-agent.service
#   /proc/<agent-pid>/status                         # no exec-related caps
#   check the unit starts and reports after enabling this drop-in
#   check that an exec attempt by any child would fail (no child should exist;
#   the agent has no exec capability and no shell)
# If the target systemd/kernel does not support the mount-based directives (<248), do
# not install this drop-in and record the gap in the B3/UM-E acceptance notes.

[Service]
# Do not use NoExecPaths=/ plus a single ExecPaths= re-allow: systemd 255 in
# the real lab accepted the first start but denied the service binary on a
# subsequent restart (203/EXEC). Hide the standard tool directories instead;
# the agent binary remains executable in /usr/local/libexec, which is
# root-owned and not writable by umagent.
NoExecPaths=/usr/bin /usr/sbin /bin /sbin /usr/libexec /usr/local/bin /usr/local/sbin
